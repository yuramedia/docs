name: CI

on:
    pull_request:
        branches: ["main"]
    push:
        branches: ["main"]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@main

            - name: Setup Bun
              uses: oven-sh/setup-bun@main
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint (Oxlint)
              run: bun run lint

            - name: Type check
              run: bun run types:check

            - name: Build
              run: bun run build
